  <text x="64" y="620" font-size="11" fill="#6E6E73">Surface 82% opasitas. Gradient putih 6% + hairline 10%</text>
  <text x="64" y="636" font-size="11" fill="#6E6E73">membentuk faux vibrancy, bukan blur asli.</text>

