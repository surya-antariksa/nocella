  <text x="64" y="168" font-size="11" fill="#6E6E73">Panel acuan #131313</text>

  <rect x="64" y="192" width="40" height="28" rx="8" fill="#000000" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
