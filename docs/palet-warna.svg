<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-label="Palet warna Nocella" font-family="Inter, 'Ubuntu Sans', Cantarell, sans-serif">
  <rect width="1100" height="900" fill="#ECECF0"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1D1D1F">Palet Warna Nocella</text>
  <text x="40" y="78" font-size="13" fill="#6E6E73">Netral dulu, satu aksen, warna status seperlunya. Swatch transparan digambar setelah dikomposit di atas panel acuan.</text>

  <rect x="40" y="110" width="500" height="560" rx="28" fill="#131313" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
